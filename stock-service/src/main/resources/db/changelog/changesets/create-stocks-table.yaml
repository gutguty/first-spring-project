databaseChangeLog:
  - changeSet:
      id: 1
      author: Bogdan Guty
      changes:
        - createTable:
            tableName: stocks
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: reserved
                  type: integer
                  constraints:
                    nullable: false
services:
  kafka-controller:
    image: apache/kafka:latest
    container_name: kafka-controller
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,PLAINTEXT_HOST://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - kafka-controller
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8090:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    depends_on:
      - kafka-broker


  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"



  postgres-stock:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB_STOCK}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_STOCK}
    volumes:
      - postgres_stock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  server:
    build: server
    ports:
      - "8080:8080"
    env_file: "server/.env"
    user: "1000:1000"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=60
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:+PrintCommandLineFlags
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc
    volumes:
      - ./server/dumps:/dumps
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      stock-service:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1"

  stock-service:
    build: stock-service
    ports:
      - "8082:8082"
    secrets:
      - source: stock_db_url
        target: spring.datasource.url
      - source: stock_db_username
        target: spring.datasource.username
      - source: stock_db_password
        target: spring.datasource.password

    depends_on:
      postgres-stock:
        condition: service_healthy
      kafka-broker:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

secrets:
  stock_db_url:
    file: ./stock-service/secrets/spring.datasource.url
  stock_db_username:
    file: ./stock-service/secrets/spring.datasource.username
  stock_db_password:
    file: ./stock-service/secrets/spring.datasource.password



volumes:
  postgres_data:
  postgres_stock_data:
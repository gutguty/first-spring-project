databaseChangeLog:
  - changeSet:
      author: Bogdan Guty
      id: 8
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: city
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: city_zone
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: users_addresses_fk
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)